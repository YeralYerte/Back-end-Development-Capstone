apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: djangoserver
  name: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      run: djangoserver
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        run: djangoserver
    spec:
      containers:
      - image: us.icr.io/sn-labs-yeralytemirb/djangoserver:1
        imagePullPolicy: Always
        name: djangoserver
        env:
        - name: SONGS_URL
          value: "https://yeralytemirb-8080.theiadockernext-0-labs-prod-theiak8s-4-tor01.proxy.cognitiveclass.ai"
        - name: PHOTO_URL
          value: "https://getpic.2h3oa5v7tzm0.us-south.codeengine.appdomain.cloud"
        ports:
        - containerPort: 8000
          protocol: TCP
      restartPolicy: Always
